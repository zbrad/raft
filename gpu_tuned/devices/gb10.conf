# gpu_tuned/devices/gb10.conf — static device config for GB10 (Grace
# Blackwell, DGX Spark, aarch64). See gpu_tuned/devices/rtx50xx.conf for
# the full explanation of GPU_TUNED_VARIANT vs. GPU_TUNED_PLATFORM.
#
# This is the CANONICAL source for the sm_121a-vs-sm_120 explanation below
# — rtx40xx.conf/rtx50xx.conf cross-reference back to this file rather than
# repeating it.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"

# ── Rule: GB10 must target sm_121a, not bare sm_121 ─────────────────────────
# The trailing "a" selects the Blackwell family-specific ("accelerated") ISA
# extensions -- e.g. the newer tensor-core instructions -- that are exposed on
# datacenter-class Blackwell silicon but are absent from the generic sm_121
# target. GB10 (Grace Blackwell, DGX Spark) is datacenter-class, so it needs
# the "a" variant. This is the opposite of RTX 50xx (consumer Blackwell),
# which must use bare sm_120 (no "a") -- see gpu_tuned/devices/rtx50xx.conf.
# Every gpu_tuned_*.sh script must derive its CUDA arch from
# GPU_TUNED_CUDA_ARCH rather than hardcoding "121a"/"121" so this can't
# drift again (it already has once — see gb10/raft_container_gb10.sh and
# gb10/pyproject.toml's fixed-up history).
GPU_TUNED_CUDA_ARCH="121a"

GPU_TUNED_HW_LABEL="GB10 / DGX Spark"
GPU_TUNED_DEVICE_LABEL="GB10"
