# gpu_tuned/devices/rtx50xx.conf — static device config for RTX 50xx
# (Blackwell consumer, x86_64). No CUDA-toolkit probing here — pure
# variable assignment, safe to source from anything (including
# gb10/raft_container_gb10.sh-style scripts that deliberately avoid
# gpu_tuned_env.sh's nvcc detection).
#
# GPU_TUNED_VARIANT is the ONLY token used for filesystem paths or
# artifact naming (build dirs, wheel/package suffixes, embed_build_info's
# variant arg, dist dirs, CHECKSUMS_<x>, release-tag variant segment).
# GPU_TUNED_PLATFORM is used only inside human-facing strings (e.g. the
# literal "x86_64" word in a release title), never a path — see
# gpu_tuned/gpu_tuned_env.sh for the uname -m assertion this enables.

GPU_TUNED_VARIANT="rtx50xx"
GPU_TUNED_PLATFORM="x86_64"

# ── Rule: RTX 50xx must target bare sm_120, not a family-specific "a" variant
# RTX 50xx (Blackwell consumer) is consumer silicon -- there is no
# family-specific ("accelerated") ISA extension exposed on it, unlike
# datacenter-class chips (e.g. GB10 needs sm_121a -- see
# gpu_tuned/devices/gb10.conf). "120" covers the whole 50-series
# (5060/5070/5080/5090 all share sm_120) since none of those SKUs differ in
# compute capability -- only in core/memory counts. Every gpu_tuned_*.sh
# script must derive its CUDA arch from GPU_TUNED_CUDA_ARCH rather than
# hardcoding "120" so this can't drift.
GPU_TUNED_CUDA_ARCH="120"

GPU_TUNED_HW_LABEL="RTX 50xx / Blackwell"
GPU_TUNED_DEVICE_LABEL="RTX 50xx"
