# devices/gb10.conf -- hardware facts for NVIDIA GB10 (DGX Spark), shared by
# every consumer. Sourced by the consumer's tuned/env.sh; do not execute.
#
# The facts every consumer agrees on, plus the canonical hardware label. There
# are no per-repo overrides: a consumer uses this file as it is.
#
# GPU_TUNED_HW_LABEL is the text used in release titles and notes. The nine
# consumers that had their own copy wrote nine different labels; this one is
# llama.cpp's, the most specific (architecture and SM level). A consumer that
# migrates here will see its release titles change.
#
# GPU_TUNED_CUDA_ARCH is the resolved arch cuobjdump reports. CMake accepts
# bare 121 and upgrades it to 121a itself; this is the resolved value.
# Note: flashinfer's own copy wrote "12.1a" under this key (dotted); the other
# consumers that use the key (llama.cpp, cuvs, raft, faiss) write 121a, which
# is used here. Reconcile flashinfer when it migrates.
#
# GPU_TUNED_HOST_OS is the host OS the artifact is for -- not the CPU, which
# GPU_TUNED_PLATFORM already covers. Every device file must set it (linux or
# windows), so adding a device forces the question to be answered, the same way
# every toolkit file must set TOOLKIT_NCCL_VERSION; tests/test_common.sh checks
# it. gpu_tuned_assert_host_os then refuses a build whose host does not match,
# so a Windows variant cannot be built by the bash scripts and emit an ELF
# labelled as Windows.
#
# WSL counts as linux, deliberately: a WSL build emits an ordinary Linux ELF,
# because libcuda.so.1 resolves by SONAME -- from /usr/lib/wsl/lib under WSL and
# from the driver package on bare Linux -- so the artifact is the same one.
# Compare devices/n1x-win.conf: the same GPU as this file, but on Windows, which
# is why it is a separate variant. The host OS goes in the variant name as a -win
# suffix (rtx50-win, n1x-win), so a bare name is always the linux one.
#
# The variant grammar is gpu_tuned_valid_variant: lowercase alphanumeric segments
# joined by "-", never leading, trailing or doubled. A hyphen is a field separator
# in a release tag and a SONAME mark, and both anchor on the "-cu<digits>" that
# follows the variant, so a multi-segment name stays readable there.
#
# A wheel label is the one place it is spelled differently: PEP 440 normalizes "-"
# to "." inside a local version, so the label is "rtx50.win.cu134.<date>.<seq>"
# while the tag is "v0.<date>.<seq>-rtx50-win-cu134". gpu_tuned_variant_label does
# that substitution and is the only place it happens; pass the variant as this file
# spells it and the producers apply it. docs/VERSIONING.md has the detail.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_HOST_OS="linux"
GPU_TUNED_CUDA_ARCH="121a"
GPU_TUNED_HW_LABEL="NVIDIA GB10 (DGX Spark, Blackwell, SM 12.1 accelerated)"
