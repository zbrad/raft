# devices/rtx50.conf -- hardware facts for NVIDIA RTX 50-series (Blackwell
# consumer, desktop/laptop, SM 120a), shared by every consumer. Sourced by the
# consumer's tuned/env.sh; do not execute. See devices/gb10.conf for the rules.
#
# GPU_TUNED_CUDA_ARCH is the resolved arch cuobjdump reports (120a), as raft,
# cuvs and faiss write it. flashinfer's copy wrote the dotted form "12.0a";
# reconcile it when it migrates. The label is the one cuvs, faiss and pytorch use.
#
# This is the Linux/ELF variant of this GPU; the native Windows build is
# devices/rtx50-win.conf. See devices/gb10.conf for what GPU_TUNED_HOST_OS means.
#
# There is deliberately no rtx50-wsl: a WSL build emits an ordinary Linux x86_64
# ELF, since libcuda.so.1 resolves by SONAME (from /usr/lib/wsl/lib under WSL,
# from the driver package on bare Linux). Labelling it -wsl would claim a
# specificity the artifact does not have, and would stop it being reused on a
# bare-Linux x86_64 node.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_HOST_OS="linux"
GPU_TUNED_CUDA_ARCH="120a"
GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, SM 120a)"
