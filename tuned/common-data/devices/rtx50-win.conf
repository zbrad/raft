# devices/rtx50-win.conf -- hardware facts for NVIDIA RTX 50-series (Blackwell
# consumer, desktop/laptop, SM 120a) built natively on Windows, shared by every
# consumer. Sourced by the consumer's tuned/env.sh; do not execute. See
# devices/gb10.conf for the rules (no per-repo overrides, key meanings).
#
# Same GPU and same CPU architecture as devices/rtx50.conf. The variant differs
# only because the host OS does, exactly as n1x-win differs from gb10: an rtx50
# artifact is a Linux/x86_64 ELF and does not run here, and an rtx50-win artifact
# is a Windows/x86_64 PE and does not run there. The device code is identical
# either way -- one device toolchain, two host toolchains -- so the cubin is the
# same sm_120a and only the host object format differs.
#
# Added 2026-11-04 at the user's say-so ("rtx50-win is the right way to go"), as
# the first native-Windows variant for an x86_64 device. x86 first on purpose:
# zscar90 has both host platforms on one machine, so windows/tests/test_parity.ps1
# can compare the bash and PowerShell loaders there, which is not possible on a
# Linux-only node.
#
# GPU_TUNED_PLATFORM is the CPU architecture in uname -m spelling, as gb10 uses.
# Windows calls x86_64 AMD64 (PROCESSOR_ARCHITECTURE); a PowerShell loader must
# map AMD64 -> x86_64 before comparing, the same mapping n1x-win.conf notes for
# ARM64 -> aarch64.
#
# Not yet buildable: no consumer has a native-Windows build path, and
# windows/tuned-common.ps1 does not load device files at all yet. The version and
# tag helpers do accept this hyphenated name (gpu_tuned_valid_variant, 2026-11-05);
# see devices/gb10.conf for how the hyphen is spelled in a wheel label. This file plus
# GPU_TUNED_HOST_OS is what stops the bash scripts accepting this variant and
# emitting an ELF labelled as Windows; the PowerShell side of that gate arrives
# with device loading in the port.

GPU_TUNED_VARIANT="rtx50-win"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_HOST_OS="windows"
GPU_TUNED_CUDA_ARCH="120a"
GPU_TUNED_HW_LABEL="RTX 50-series (Blackwell consumer, desktop/laptop, SM 120a), Windows"
