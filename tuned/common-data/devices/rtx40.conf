# devices/rtx40.conf -- hardware facts for NVIDIA RTX 40-series (Ada Lovelace,
# SM 89), shared by every consumer. Sourced by the consumer's tuned/env.sh; do
# not execute. See devices/gb10.conf for the rules (no per-repo overrides, key
# meanings).
#
# The label is the one cuvs and faiss already use. Repos that wrote another
# (raft: "RTX 40 / Ada") will see their release titles change when they migrate.
# Repos whose arch key is not GPU_TUNED_CUDA_ARCH (flash-attention writes
# GPU_TUNED_FA_ARCH="80", a deliberate sm_80 compat path) keep that key in repo.env.
#
# GPU_TUNED_HOST_OS is linux: the rtx40 machines are Windows boxes, but these
# builds run in WSL and emit ordinary Linux x86_64 ELF artifacts. See
# devices/gb10.conf for what the key means and why WSL counts as linux. A native
# Windows build of this GPU would be a separate rtx40-win; none exists yet.

GPU_TUNED_VARIANT="rtx40"
GPU_TUNED_PLATFORM="x86_64"
GPU_TUNED_HOST_OS="linux"
GPU_TUNED_CUDA_ARCH="89"
GPU_TUNED_HW_LABEL="RTX 4080/4090 (Ada Lovelace, SM 89)"
