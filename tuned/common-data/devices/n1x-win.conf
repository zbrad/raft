# devices/n1x-win.conf -- hardware facts for the NVIDIA RTX Spark N1X (Blackwell
# GPU, Arm64 CPU, Windows on Arm, SM 12.1a) built natively on Windows, shared by
# every consumer. Sourced by the consumer's tuned/env.sh; do not execute. See
# devices/gb10.conf for the rules.
#
# The GPU is the same SM 12.1a as gb10, so GPU_TUNED_CUDA_ARCH matches it. The
# variant differs because the OS (Windows) and the CPU do: a gb10 artifact is a
# Linux/aarch64 ELF and does not run here. CMake accepts bare 121 and upgrades it
# to 121a itself; this is the resolved value (what cuobjdump reports).
#
# GPU_TUNED_PLATFORM is the CPU architecture in uname -m spelling, as gb10 uses.
# Windows itself calls it ARM64 (PROCESSOR_ARCHITECTURE); a PowerShell loader
# must map ARM64 -> aarch64 before comparing.
#
# Named n1x-win, not n1x, at the user's say-so (2026-11-05, "rename n1x to n1x-win
# as well"). The -win suffix is the convention, the same as rtx50 vs rtx50-win:
# the host OS is in the variant name, never implied by the product name, so a
# bare variant name is always the linux one. Renamed before anything was built
# for it -- per the user, nothing is built for n1x yet -- so no release tag,
# output tree or pin should carry the old spelling; the references here were
# comments, in this file, gb10.conf and rtx50-win.conf.
#
# Whether a bare n1x is ever a variant of its own is left open. A WSL-on-Arm
# build on this machine would emit a Linux/aarch64 ELF for the same 121a as
# devices/gb10.conf, so it may turn out to be gb10 built on a second host rather
# than a third artifact. The naming leaves room for either and does not decide it.
#
# Not yet buildable, for the same two reasons as rtx50-win: no consumer has a
# native-Windows build path, and windows/tuned-common.ps1 does not load device
# files. The hyphenated name itself is accepted by the version and tag helpers
# (gpu_tuned_valid_variant); see devices/gb10.conf for how it is spelled in a
# wheel label.

GPU_TUNED_VARIANT="n1x-win"
GPU_TUNED_PLATFORM="aarch64"
GPU_TUNED_HOST_OS="windows"
GPU_TUNED_CUDA_ARCH="121a"
GPU_TUNED_HW_LABEL="NVIDIA RTX Spark N1X (Windows on Arm64, Blackwell, SM 12.1 accelerated)"
