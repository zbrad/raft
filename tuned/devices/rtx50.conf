# tuned/devices/rtx50.conf — static device config for RTX 50
# (Blackwell consumer, x86_64). No CUDA-toolkit probing here — pure
# variable assignment, safe to source from anything (including
# tuned/gb10/raft_container_gb10.sh-style scripts that deliberately avoid
# env.sh's nvcc detection).
#
# GPU_TUNED_VARIANT is the ONLY token used for filesystem paths or
# artifact naming (build dirs, wheel/package suffixes, embed_build_info's
# variant arg, dist dirs, CHECKSUMS_<x>, release-tag variant segment).
# GPU_TUNED_PLATFORM is used only inside human-facing strings (e.g. the
# literal "x86_64" word in a release title), never a path — see
# tuned/env.sh for the uname -m assertion this enables.

GPU_TUNED_VARIANT="rtx50"
GPU_TUNED_PLATFORM="x86_64"

# ── Rule: RTX 50 must target sm_120a, not bare sm_120 ─────────────────────
# Consumer Blackwell (RTX 50-series) DOES expose a family-specific
# ("accelerated") ISA extension via the "a" suffix -- same category as
# GB10's sm_121a (see tuned/devices/gb10.conf), just previously assumed
# not to apply here. sm_120a is a real, NVIDIA-documented target for
# RTX 5090/5080/5070/etc., exposing accelerated tensor-core instructions
# (e.g. FP4 support) that are NOT available under bare sm_120. Bare
# sm_120 is the compatibility/baseline target; sm_120f (CUDA 12.9+) is
# the family-portable target across the whole 12.x line -- neither is
# what a build "tuned" to exactly this one device wants. "120a" covers
# the whole 50-series (5060/5070/5080/5090 all share sm_120a) since none
# of those SKUs differ in compute capability -- only in core/memory
# counts. Every tuned/*.sh script must derive its CUDA arch from
# GPU_TUNED_CUDA_ARCH rather than hardcoding "120a" so this can't drift.
GPU_TUNED_CUDA_ARCH="120a"

GPU_TUNED_HW_LABEL="RTX 50 / Blackwell"
GPU_TUNED_DEVICE_LABEL="RTX 50"
