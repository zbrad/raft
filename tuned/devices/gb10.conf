# tuned/devices/gb10.conf — static device config for GB10 (Grace
# Blackwell, DGX Spark, aarch64). See tuned/devices/rtx50.conf for
# the full explanation of GPU_TUNED_VARIANT vs. GPU_TUNED_PLATFORM.
#
# This is the CANONICAL source for the sm_121a-vs-sm_120 explanation below
# — rtx40.conf/rtx50.conf cross-reference back to this file rather than
# repeating it.

GPU_TUNED_VARIANT="gb10"
GPU_TUNED_PLATFORM="aarch64"

# ── Rule: GB10 must target sm_121a, not bare sm_121 ─────────────────────────
# The trailing "a" selects the Blackwell family-specific ("accelerated") ISA
# extensions -- e.g. the newer tensor-core instructions -- that are exposed on
# Blackwell silicon under the "a" suffix and absent from the generic
# non-suffixed sm_121 target. GB10 (Grace Blackwell, DGX Spark) needs the
# "a" variant -- so does RTX 50 (consumer Blackwell): both expose this
# accelerated instruction set, contrary to an earlier assumption here that
# only datacenter-class chips did -- see tuned/devices/rtx50.conf, which
# also targets sm_120a for the same reason.
# Every tuned/*.sh script must derive its CUDA arch from
# GPU_TUNED_CUDA_ARCH rather than hardcoding "121a"/"121" so this can't
# drift again (it already has once — see tuned/gb10/raft_container_gb10.sh
# and tuned/gb10/pyproject.toml's fixed-up history).
GPU_TUNED_CUDA_ARCH="121a"

GPU_TUNED_HW_LABEL="GB10 / DGX Spark"
GPU_TUNED_DEVICE_LABEL="GB10"
