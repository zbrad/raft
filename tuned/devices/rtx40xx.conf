# tuned/devices/rtx40xx.conf — static device config for RTX 40xx
# (Ada Lovelace consumer, x86_64). See tuned/devices/rtx50xx.conf for
# the full explanation of GPU_TUNED_VARIANT vs. GPU_TUNED_PLATFORM.

GPU_TUNED_VARIANT="rtx40xx"
GPU_TUNED_PLATFORM="x86_64"

# ── Rule: RTX 40xx must target bare sm_89, not a family-specific "a" variant
# RTX 40xx (Ada Lovelace) is consumer silicon -- there is no family-specific
# ("accelerated") ISA extension exposed on it, unlike datacenter-class chips
# (e.g. GB10 needs sm_121a -- see tuned/devices/gb10.conf). "89" covers
# the whole 40-series (4060/4070/4080/4090 all share sm_89) since none of
# those SKUs differ in compute capability -- only in core/memory counts.
# Every tuned/*.sh script must derive its CUDA arch from
# GPU_TUNED_CUDA_ARCH rather than hardcoding "89" so this can't drift.
GPU_TUNED_CUDA_ARCH="89"

GPU_TUNED_HW_LABEL="RTX 40xx / Ada"
GPU_TUNED_DEVICE_LABEL="RTX 40xx"
